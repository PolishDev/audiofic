<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft hover shadow beneath the floating mascot -->
    <radialGradient id="hoverShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Ghost body 3D volume gradient -->
    <linearGradient id="ghostBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E1F0FD" />
    </linearGradient>

    <!-- Headphone Cushion Gradient -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Accent Pink -->
    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Ghost Subtle Outline Shadow (For crisp visibility on pure white backgrounds) -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- 1. Floating Floor Shadow -->
  <ellipse cx="256" cy="466" rx="104" ry="16" fill="url(#hoverShadow)" />

  <!-- 2. Musical / Audio Storytelling Elements Floating Around -->
  <!-- Floating musical note top right -->
  <path d="M 416 130 C 416 115 432 110 442 108 L 442 136 C 438 134 430 134 426 138 C 420 144 424 152 432 152 C 438 152 444 146 444 138 L 444 116 L 420 122 L 420 130 Z" 
        fill="#A855F7" opacity="0.85" />
  <!-- Floating musical note top left -->
  <ellipse cx="96" cy="142" rx="7" ry="5.5" transform="rotate(-20 96 142)" fill="#EC4899" opacity="0.85" />
  <path d="M 102 140 L 102 115 C 108 114 114 118 116 122" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Gentle Audio Wave Ripples Left -->
  <path d="M 94 200 C 82 215 82 235 94 250" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Gentle Audio Wave Ripples Right -->
  <path d="M 418 200 C 430 215 430 235 418 250" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Floating Sparkles -->
  <path d="M 390 90 Q 396 90 396 84 Q 396 90 402 90 Q 396 90 396 96 Q 396 90 390 90 Z" fill="#FBBF24" />
  <circle cx="125" cy="170" r="3.5" fill="#38BDF8" />

  <!-- 3. Over-Ear Headphone Arch (Behind Head) -->
  <path d="M 148 185 C 148 92 196 62 256 62 C 316 62 364 92 364 185" 
        stroke="url(#headphoneGrad)" stroke-width="28" stroke-linecap="round" fill="none" />
  <path d="M 205 70 C 225 66 287 66 307 70" 
        stroke="#C084FC" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- 4. Ghost Main Body Silhouette with soft drop shadow -->
  <g filter="url(#softGlow)">
    <!-- Base Body: Floating serenely -->
    <path d="M 146 195 
             C 146 95 196 78 256 78 
             C 316 78 366 95 366 195 
             C 366 265 384 325 384 375
             C 384 404 365 424 345 408
             C 330 396 316 396 302 414
             C 288 428 268 428 256 416
             C 244 428 224 428 210 414
             C 196 396 182 396 167 408
             C 147 424 128 404 128 375
             C 128 325 146 265 146 195 Z" 
          fill="url(#ghostBodyGrad)" 
          stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Ghost Lower Tail Folds / Ambient Shading -->
    <path d="M 128 375
             C 128 390 144 416 167 408
             C 182 396 196 396 210 414
             C 224 428 244 428 256 416
             C 268 428 288 428 302 414
             C 316 396 330 396 345 408
             C 368 416 384 390 384 375
             C 384 392 364 428 345 416
             C 328 405 316 408 302 422
             C 286 438 266 438 256 424
             C 246 438 226 438 210 422
             C 196 408 184 405 167 416
             C 148 428 128 392 128 375 Z" 
          fill="#CBD5E1" opacity="0.45" />

    <!-- Cute Chubby Ghost Belly Shading (Duolingo style soft volume) -->
    <ellipse cx="256" cy="355" rx="84" ry="46" fill="#E2F1FD" opacity="0.75" />

    <!-- Arms Cupping the Headphones from Outer Sides (Clean silhouette) -->
    <!-- Left Arm & Hand -->
    <g>
      <path d="M 146 280 
               C 125 270 114 245 116 218 
               C 118 196 136 196 142 216 
               C 146 230 152 255 156 278 Z" 
            fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Rounded cute hand cupping bottom of left earcup -->
      <circle cx="128" cy="214" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    </g>

    <!-- Right Arm & Hand -->
    <g>
      <path d="M 366 280 
               C 387 270 398 245 396 218 
               C 394 196 376 196 370 216 
               C 366 230 360 255 356 278 Z" 
            fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Rounded cute hand cupping bottom of right earcup -->
      <circle cx="384" cy="214" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    </g>
  </g>

  <!-- 5. Headphone Ear-Cups (Over the ears) -->
  <!-- Left Ear-Cup -->
  <g transform="translate(118, 170)">
    <rect x="0" y="0" width="36" height="82" rx="18" fill="#7C3AED" />
    <rect x="6" y="8" width="24" height="66" rx="12" fill="#581C87" />
    <circle cx="18" cy="41" r="8" fill="url(#accentPink)" />
  </g>

  <!-- Right Ear-Cup -->
  <g transform="translate(358, 170)">
    <rect x="0" y="0" width="36" height="82" rx="18" fill="#7C3AED" />
    <rect x="6" y="8" width="24" height="66" rx="12" fill="#581C87" />
    <circle cx="18" cy="41" r="8" fill="url(#accentPink)" />
  </g>

  <!-- 6. Cute Blush Cheeks (Uninterrupted and cute) -->
  <ellipse cx="182" cy="256" rx="24" ry="15" fill="#FDA4AF" opacity="0.9" />
  <ellipse cx="330" cy="256" rx="24" ry="15" fill="#FDA4AF" opacity="0.9" />

  <!-- 7. Peaceful / Immersed Listening Eyes (Happy Closed Curved Arcs with Duolingo Charm) -->
  <!-- Left Eye Arc -->
  <path d="M 184 214 C 194 194 220 194 230 214" 
        stroke="#1E1B4B" stroke-width="7.5" stroke-linecap="round" fill="none" />
  <!-- Cute mini eyebrow left -->
  <path d="M 194 184 C 204 178 218 180 224 184" 
        stroke="#1E1B4B" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Right Eye Arc -->
  <path d="M 282 214 C 292 194 318 194 328 214" 
        stroke="#1E1B4B" stroke-width="7.5" stroke-linecap="round" fill="none" />
  <!-- Cute mini eyebrow right -->
  <path d="M 288 184 C 294 180 308 178 318 184" 
        stroke="#1E1B4B" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- 8. Blissful Listening Smile -->
  <path d="M 242 246 C 242 266 270 266 270 246" 
        stroke="#1E1B4B" stroke-width="5.5" stroke-linecap="round" fill="none" />
</svg>
