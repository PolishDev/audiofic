<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Icon Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Subtle radial glow for mysterious depth -->
    <radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </radialGradient>

    <!-- Headphone Cushion Gradient -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- 1. Background: Ghost spectral white skin filling the entire squircle -->
    <rect width="512" height="512" fill="url(#ghostGlow)" />

    <!-- Ghost top curve / head volume shadow at the top -->
    <path d="M 0 0 L 512 0 L 512 90 C 400 60 112 60 0 90 Z" fill="#E2E8F0" opacity="0.4" />

    <!-- 2. Over-Ear Headphone Band (Arching across the top border like Duolingo accessories) -->
    <path d="M 32 180 C 32 60 120 28 256 28 C 392 28 480 60 480 180" 
          stroke="url(#headphoneGrad)" stroke-width="36" stroke-linecap="round" fill="none" />
    <path d="M 160 38 C 200 32 312 32 352 38" 
          stroke="#C084FC" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- 3. Headphone Ear-Cups (Mounted on the left & right edges of the squircle) -->
    <!-- Left Cup -->
    <rect x="-10" y="150" width="62" height="150" rx="31" fill="#7C3AED" />
    <rect x="0" y="165" width="36" height="120" rx="18" fill="#581C87" />
    <circle cx="18" cy="225" r="10" fill="url(#accentPink)" />

    <!-- Right Cup -->
    <rect x="460" y="150" width="62" height="150" rx="31" fill="#7C3AED" />
    <rect x="476" y="165" width="36" height="120" rx="18" fill="#581C87" />
    <circle cx="494" cy="225" r="10" fill="url(#accentPink)" />

    <!-- 4. Rosy Cheeks (Cute blush spots like Duo) -->
    <ellipse cx="100" cy="330" rx="32" ry="20" fill="#FDA4AF" opacity="0.75" />
    <ellipse cx="412" cy="330" rx="32" ry="20" fill="#FDA4AF" opacity="0.75" />

    <!-- 5. Giant Duolingo-Style Eyes (Centered, dominating the frame, irresistible tap-appeal) -->
    <!-- Left Eye -->
    <ellipse cx="170" cy="245" rx="56" ry="76" fill="#1E1B4B" />
    <!-- Big Catchlight Highlight -->
    <circle cx="152" cy="218" r="24" fill="#FFFFFF" />
    <!-- Small Secondary Highlight -->
    <circle cx="192" cy="265" r="11" fill="#FFFFFF" />

    <!-- Right Eye -->
    <ellipse cx="342" cy="245" rx="56" ry="76" fill="#1E1B4B" />
    <!-- Big Catchlight Highlight -->
    <circle cx="324" cy="218" r="24" fill="#FFFFFF" />
    <!-- Small Secondary Highlight -->
    <circle cx="364" cy="265" r="11" fill="#FFFFFF" />

    <!-- 6. Expressive Mouth (Duolingo Shocked / Story Cliffhanger Gasp) -->
    <!-- Mouth Outer Shadow/Rim -->
    <ellipse cx="256" cy="368" rx="44" ry="54" fill="#1E1B4B" />
    <!-- Tongue / Inner Glow (Surprised plot-twist expression) -->
    <ellipse cx="256" cy="392" rx="28" ry="22" fill="#F43F5E" />

    <!-- 7. Bottom Ghost Waves (Ghost sheet ripples peeking subtly at bottom border) -->
    <path d="M 60 512 C 90 475 140 475 170 512 C 200 475 250 475 280 512 C 310 475 360 475 390 512 C 420 475 460 475 490 512" 
          stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>
