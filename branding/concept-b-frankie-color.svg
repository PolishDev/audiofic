<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <title>AudioFic Mascot - Frankie (Full Color)</title>

  <!-- Left 3.5mm Audio Jack Bolt -->
  <!-- Plug shaft with golden brass & headphone rings -->
  <rect x="20" y="140" width="28" height="20" rx="4" fill="#FACC15"/>
  <rect x="36" y="132" width="12" height="36" rx="4" fill="#EAB308"/>
  <line x1="28" y1="140" x2="28" y2="160" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="32" y1="140" x2="32" y2="160" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Headphone cord loop -->
  <path d="M 28 160 C 28 188 46 196 56 190" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

  <!-- Right 3.5mm Audio Jack Bolt -->
  <!-- Plug shaft with golden brass & headphone rings -->
  <rect x="208" y="140" width="28" height="20" rx="4" fill="#FACC15"/>
  <rect x="208" y="132" width="12" height="36" rx="4" fill="#EAB308"/>
  <line x1="228" y1="140" x2="228" y2="160" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="224" y1="140" x2="224" y2="160" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Headphone cord loop -->
  <path d="M 228 160 C 228 188 210 196 200 190" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

  <!-- Main Head Squircle Contour (Deep midnight outline) -->
  <rect x="48" y="44" width="160" height="168" rx="42" fill="#0F172A"/>

  <!-- Inner Face Area (Electric Monster Mint Green) -->
  <rect x="58" y="54" width="140" height="148" rx="34" fill="#10B981"/>

  <!-- Frankenstein Flat-Top Hair with Jagged Bangs (Midnight Slate Blue) -->
  <path d="M 58 84 
           L 58 54 
           C 58 44 68 44 78 44 
           L 178 44 
           C 188 44 198 44 198 54 
           L 198 84 
           L 180 74 
           L 164 94 
           L 144 72 
           L 128 92 
           L 112 72 
           L 92 94 
           L 76 74 
           Z" 
        fill="#0F172A"/>

  <!-- Soft Green Cheeks -->
  <ellipse cx="80" cy="162" rx="8" ry="4.5" fill="#059669" opacity="0.4"/>
  <ellipse cx="176" cy="162" rx="8" ry="4.5" fill="#059669" opacity="0.4"/>

  <!-- Soundwave Suture / Cicatriz de Onda Sonora na Testa (Deep Royal Purple Stitch) -->
  <g stroke="#312E81" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pulse Audio Wave -->
    <path d="M 76 116 L 90 116 L 96 106 L 104 126 L 112 102 L 122 130 L 130 110 L 138 120 L 146 116 L 180 116"/>
    <!-- Cross Stitch Lines -->
    <line x1="86" y1="110" x2="86" y2="122"/>
    <line x1="100" y1="110" x2="100" y2="122"/>
    <line x1="126" y1="110" x2="126" y2="122"/>
    <line x1="152" y1="110" x2="152" y2="122"/>
    <line x1="170" y1="110" x2="170" y2="122"/>
  </g>

  <!-- Quirky Expressive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="98" cy="150" rx="13" ry="16" fill="#0F172A"/>
  <circle cx="94" cy="145" r="5" fill="#FFFFFF"/>
  <circle cx="103" cy="154" r="2.2" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="158" cy="150" rx="12" ry="15" fill="#0F172A"/>
  <circle cx="155" cy="145" r="4.5" fill="#FFFFFF"/>
  <circle cx="163" cy="154" r="2" fill="#FFFFFF"/>

  <!-- Happy Toothy Grin -->
  <path d="M 104 172 Q 128 170 152 172 C 154 192 146 196 128 196 C 110 196 102 192 104 172 Z" fill="#0F172A"/>
  <!-- Cute monster tooth sticking down -->
  <rect x="114" y="172" width="8" height="8" rx="2" fill="#FFFFFF"/>
  <!-- Cute monster tooth sticking up -->
  <rect x="136" y="188" width="7" height="7" rx="2" fill="#FFFFFF"/>
  <!-- Tongue -->
  <path d="M 122 192 C 126 188 130 188 134 192 Z" fill="#F472B6"/>
</svg>
