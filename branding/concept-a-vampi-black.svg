        stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <!-- Headband inner cushion bar -->
  <path d="M 96 38 C 106 34 116 33 128 33 C 140 33 150 34 160 38" 
        stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Left Headphone Ear-Cup (Chunky modern headphone) -->
  <rect x="34" y="104" width="28" height="60" rx="14" fill="#000000"/>
  <rect x="40" y="112" width="14" height="44" rx="7" fill="#FFFFFF"/>
  <rect x="44" y="120" width="6" height="28" rx="3" fill="#000000"/>

  <!-- Right Headphone Ear-Cup -->
  <rect x="194" y="104" width="28" height="60" rx="14" fill="#000000"/>
  <rect x="202" y="112" width="14" height="44" rx="7" fill="#FFFFFF"/>
  <rect x="206" y="120" width="6" height="28" rx="3" fill="#000000"/>

  <!-- Eyes (Big, playful anime eyes) -->
  <!-- Left Eye -->
  <ellipse cx="106" cy="142" rx="11" ry="15" fill="#000000"/>
  <circle cx="103" cy="137" r="4.5" fill="#FFFFFF"/>
  <circle cx="110" cy="146" r="2" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="150" cy="142" rx="11" ry="15" fill="#000000"/>
  <circle cx="147" cy="137" r="4.5" fill="#FFFFFF"/>
  <circle cx="154" cy="146" r="2" fill="#FFFFFF"/>

  <!-- Cheerful Smile with Cute Fangs -->
  <path d="M 110 164 Q 128 161 146 164 C 148 186 138 190 128 190 C 118 190 108 186 110 164 Z" fill="#000000"/>
  <!-- Tongue -->
  <path d="M 118 180 C 122 176 134 176 138 180 C 134 188 122 188 118 180 Z" fill="#FFFFFF"/>
  <!-- Left Fang -->
  <path d="M 115 164 L 121 164 L 118 173 Z" fill="#FFFFFF"/>
  <!-- Right Fang -->
  <path d="M 135 164 L 141 164 L 138 173 Z" fill="#FFFFFF"/>
</svg>
