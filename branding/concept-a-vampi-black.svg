<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <title>AudioFic Mascot - Vampi (Monochrome)</title>

  <!-- Dracula High Collar (Sharp, dramatic yet cute framing) -->
  <path d="M 52 144 L 38 116 C 34 186 72 226 128 226 C 184 226 222 186 218 116 L 204 144 C 188 190 158 206 128 206 C 98 206 68 190 52 144 Z" 
        fill="#000000"/>
  <!-- Bowtie with audio play glyph -->
  <path d="M 112 216 L 128 224 L 112 232 Z" fill="#000000"/>
  <path d="M 144 216 L 128 224 L 144 232 Z" fill="#000000"/>
  <circle cx="128" cy="224" r="3" fill="#FFFFFF"/>

  <!-- Head Base Contour (Plump, friendly round face) -->
  <path d="M 68 134 C 68 84 94 66 128 66 C 162 66 188 84 188 134 C 188 182 162 202 128 202 C 94 202 68 182 68 134 Z" 
        fill="#000000"/>

  <!-- Face Inner Light Mask -->
  <path d="M 76 136 C 76 102 96 86 128 86 C 160 86 180 102 180 136 C 180 176 160 196 128 196 C 96 196 76 176 76 136 Z" 
        fill="#FFFFFF"/>

  <!-- Vampire Widow's Peak Hairline (Dracula style) -->
  <path d="M 76 116 C 90 98 112 88 128 114 C 144 88 166 98 180 116 C 174 94 154 82 128 82 C 102 82 82 94 76 116 Z" 
        fill="#000000"/>

  <!-- Bat Ears (Mounted seamlessly on the top arch) -->
  <!-- Left Ear -->
  <path d="M 66 68 L 48 18 C 72 30 88 44 94 50 Z" fill="#000000"/>
  <path d="M 66 60 L 56 28 C 70 38 80 46 84 50 Z" fill="#FFFFFF"/>
  <!-- Right Ear -->
  <path d="M 190 68 L 208 18 C 184 30 168 44 162 50 Z" fill="#000000"/>
  <path d="M 190 60 L 200 28 C 186 38 176 46 172 50 Z" fill="#FFFFFF"/>

  <!-- Headphone Over-Ear Band (Unbroken solid arch) -->
