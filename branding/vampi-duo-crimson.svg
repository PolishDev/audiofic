<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Icon Squircle Clip -->
    <clipPath id="squircleClipVampi">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Crimson App Icon Gradient Background -->
    <linearGradient id="vampiCrimsonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Porcelain Moonlit Face Gradient -->
    <linearGradient id="vampiFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>

    <linearGradient id="headphoneViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircleClipVampi)">
    <!-- 1. Rich Crimson App Icon Background -->
    <rect width="512" height="512" fill="url(#vampiCrimsonBg)" />

    <!-- 2. Bat Ears (Sprouting from head top) -->
    <!-- Left Ear -->
    <path d="M 120 120 L 70 30 C 110 50 145 80 156 100 Z" fill="#1E1035" />
    <path d="M 115 105 L 88 48 C 110 65 128 85 134 98 Z" fill="#F43F5E" />
    <!-- Right Ear -->
    <path d="M 392 120 L 442 30 C 402 50 367 80 356 100 Z" fill="#1E1035" />
    <path d="M 397 105 L 424 48 C 402 65 384 85 378 98 Z" fill="#F43F5E" />

    <!-- 3. Head Contour & Face Fill (Zoomed Close-Up, Plump & Friendly) -->
    <path d="M 110 210 
             C 110 110 170 82 256 82 
             C 342 82 402 110 402 210 
             C 402 340 342 450 256 450 
             C 170 450 110 340 110 210 Z" 
          fill="url(#vampiFaceGrad)" />

    <!-- 4. Dracula Widow's Peak Hairline (Midnight Violet Hair) -->
    <path d="M 110 180 
             C 140 140 190 120 256 180 
             C 322 120 372 140 402 180 
             C 392 120 342 82 256 82 
             C 170 82 120 120 110 180 Z" 
          fill="#1E1035" />

    <!-- 5. Headphone Over-Ear Band (Arching over top) -->
    <path d="M 94 220 C 94 90 156 38 256 38 C 356 38 418 90 418 220" 
          stroke="url(#headphoneViolet)" stroke-width="32" stroke-linecap="round" fill="none" />
    <path d="M 190 48 C 220 44 292 44 322 48" 
          stroke="#A78BFA" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- 6. Headphone Ear-Cups -->
    <!-- Left Cup -->
    <rect x="56" y="180" width="56" height="130" rx="28" fill="#1E1035" />
    <rect x="68" y="195" width="32" height="100" rx="16" fill="#4C1D95" />
    <circle cx="84" cy="245" r="9" fill="#F59E0B" />

    <!-- Right Cup -->
    <rect x="400" y="180" width="56" height="130" rx="28" fill="#1E1035" />
    <rect x="412" y="195" width="32" height="100" rx="16" fill="#4C1D95" />
    <circle cx="428" cy="245" r="9" fill="#F59E0B" />

    <!-- 7. Cute Rosy Cheeks -->
    <ellipse cx="155" cy="305" rx="26" ry="16" fill="#FDA4AF" opacity="0.8" />
    <ellipse cx="357" cy="305" rx="26" ry="16" fill="#FDA4AF" opacity="0.8" />

    <!-- 8. Giant Expressive Duolingo Eyes -->
    <!-- Left Eye -->
    <ellipse cx="196" cy="240" rx="46" ry="64" fill="#1E1035" />
    <circle cx="180" cy="216" r="20" fill="#FFFFFF" />
    <circle cx="214" cy="256" r="9" fill="#FFFFFF" />

    <!-- Right Eye -->
    <ellipse cx="316" cy="240" rx="46" ry="64" fill="#1E1035" />
    <circle cx="300" cy="216" r="20" fill="#FFFFFF" />
    <circle cx="334" cy="256" r="9" fill="#FFFFFF" />

    <!-- 9. Cheerful Toothy Vampire Smile with Cute Fangs -->
    <!-- Mouth Cavity -->
    <path d="M 200 325 Q 256 318 312 325 C 318 385 292 400 256 400 C 220 400 194 385 200 325 Z" fill="#881337" />
    <!-- Tongue -->
    <path d="M 224 372 C 236 358 276 358 288 372 C 276 395 236 395 224 372 Z" fill="#FB7185" />
    <!-- Left Vampire Fang -->
    <path d="M 214 324 L 232 324 L 223 350 Z" fill="#FFFFFF" />
    <!-- Right Vampire Fang -->
    <path d="M 280 324 L 298 324 L 289 350 Z" fill="#FFFFFF" />

    <!-- 10. Golden Play Button Bowtie at bottom -->
    <path d="M 210 445 L 256 465 L 210 485 Z" fill="#F59E0B" />
    <path d="M 302 445 L 256 465 L 302 485 Z" fill="#F59E0B" />
    <circle cx="256" cy="465" r="9" fill="#FDE68A" />
  </g>
</svg>
